[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-copilot"
version = "0.12.1"
description = "Read-only shadow-memory sidecar for coding agents: faithful, evidence-cited recap + safety judgment + grounded chat."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "audiofool" }]
keywords = ["claude-code", "codex", "tui", "observability", "agent", "cli", "sidecar"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []                      # the core + CLI are zero-dependency, on purpose

[project.optional-dependencies]
tui = ["textual>=2.0"]                 # the full-screen cockpit only (themes, palette, anchor)

[project.scripts]
cc-copilot = "cccopilot.cli:main"

[tool.setuptools]
packages = ["cccopilot"]

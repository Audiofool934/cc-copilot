name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (stdlib only)
        run: python -m unittest discover -s tests -t .
      - name: Zero-dependency import smoke
        run: python -c "import cccopilot.cli; print('core/CLI imports on stdlib alone')"
      - name: Cockpit imports with the optional extra
        run: |
          python -m pip install --quiet textual
          python -c "import cccopilot.tui; print('cockpit (textual) imports')"

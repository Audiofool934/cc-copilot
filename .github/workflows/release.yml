name: publish

# Cut a release by pushing a version tag (e.g. `git tag -a v0.13.2 && git push origin v0.13.2`).
# Publishing uses PyPI Trusted Publishing (OIDC) — no API tokens are stored anywhere.
# One-time PyPI setup is required before the first run; see docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist + wheel
        run: |
          python -m pip install --quiet build twine
          python -m build

      - name: Metadata renders on PyPI (twine check)
        run: python -m twine check dist/*

      - name: Tag must match the package version (both sources)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          INIT="$(python -c 'import cccopilot; print(cccopilot.__version__)')"
          PROJ="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$TAG  __init__=$INIT  pyproject=$PROJ"
          # check BOTH — the published wheel's version comes from pyproject, and a
          # wrong tag->version pair can't be re-uploaded to PyPI.
          if [ "$TAG" != "$INIT" ] || [ "$TAG" != "$PROJ" ]; then
            echo "::error::version mismatch — tag v$TAG, __init__ $INIT, pyproject $PROJ. Bump both in lockstep."
            exit 1
          fi

      - name: Smoke-test the built wheel (entry point + adapters import)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet dist/*.whl
          cd /tmp                                   # leave the repo so the source tree can't shadow the install
          /tmp/smoke/bin/cc-copilot --version
          /tmp/smoke/bin/python -c "import cccopilot.cli, cccopilot.sources.codex, cccopilot.sources.claude; print('wheel smoke OK')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # OIDC token for Trusted Publishing — this is what replaces an API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # @release/v1 is PyPA's official, security-maintained moving ref for the
      # token-less OIDC publish (their documented recommendation). For maximum
      # supply-chain hardening you can pin this to a specific release tag/SHA at
      # the cost of manual bumps — see docs/RELEASING.md.
      - uses: pypa/gh-action-pypi-publish@release/v1
